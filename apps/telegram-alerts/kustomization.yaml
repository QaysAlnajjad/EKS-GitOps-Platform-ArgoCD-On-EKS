apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: The Kubernetes secret "telegram-webhook-secret" (TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID) is intentionally NOT stored in Git. It must be created
# manually in the "monitoring" namespace before this app is synced, e.g.:
#
#   kubectl create secret generic telegram-webhook-secret \
#     -n monitoring \
#     --from-literal=TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN \
#     --from-literal=TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID
#
# The deployment references it via secretKeyRef.
resources:
  - deployment.yaml
  - service.yaml
