# ------------------------
# Global
# ------------------------
namespaceOverride: monitoring

rbac:
  create: true

# ------------------------
# Prometheus
# ------------------------
prometheus:
  enabled: true

  prometheusSpec:
    replicas: 1
    retention: 12h

    serviceMonitorSelectorNilUsesHelmValues: true
    podMonitorSelectorNilUsesHelmValues: true

# ------------------------
# Alertmanager
# ------------------------
alertmanager:
  enabled: true
  
  rbac:
    create: true

  alertmanagerSpec:
    alertmanagerConfigMatcherStrategy:
      type: None
    replicas: 1
    
  config:
    global:
      resolve_timeout: 5m

# ------------------------
# Grafana
# ------------------------
grafana:
  enabled: true

  rbac:
    create: false

  # Do not hardcode the admin password in Git. Source it from a
  # pre-created secret in the "monitoring" namespace, e.g.:
  #
  #   kubectl create secret generic grafana-admin \
  #     -n monitoring \
  #     --from-literal=admin-user=admin \
  #     --from-literal=admin-password="$GRAFANA_ADMIN_PASSWORD"
  #
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsEnabled: true

# ------------------------
# Node exporter
# ------------------------
nodeExporter:
  enabled: true

  rbac:
    create: false

# ------------------------
# kube-state-metrics
# ------------------------
kubeStateMetrics:
  enabled: true

  rbac:
    create: false
